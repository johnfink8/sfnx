name: Bug
description: The engine, the front end or the build does something wrong (a failure, wrong output, a hang, a crash).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to make it happen
      description: The command or request, the config (serve/*.json or your own), and the model (UD-Q4_K_XL, Q8_0, other).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The engine's output from start-up to the failure (journalctl -u sfnx, or the program's stderr).
      render: text
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Build and cards
      description: |
        The output of:
        ```sh
        git rev-parse --short HEAD; cat build/arch build/ncard build/cuda
        nvidia-smi; nvidia-smi topo -m
        ```
      render: text
    validations:
      required: true
